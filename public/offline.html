<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00d4ff" />
    <title>Vexora Offline</title>
    <style>
      :root {
        color-scheme: dark;
        background: #080d1c;
        color: #ffffff;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 12%, rgba(0, 212, 255, 0.22), transparent 36%),
          radial-gradient(circle at 80% 76%, rgba(217, 70, 239, 0.18), transparent 34%),
          #080d1c;
      }
      .shell {
        width: min(420px, 100%);
        border: 1px solid rgba(0, 212, 255, 0.24);
        border-radius: 28px;
        padding: 28px;
        background: rgba(10, 14, 39, 0.86);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45), 0 0 28px rgba(0, 212, 255, 0.12);
        text-align: center;
      }
      .mark {
        width: 220px;
        height: 160px;
        margin: 0 auto 18px;
        object-fit: contain;
        filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.32));
      }
      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0;
      }
      p {
        margin: 12px 0 0;
        color: rgba(255, 255, 255, 0.72);
        line-height: 1.6;
      }
      button {
        margin-top: 22px;
        width: 100%;
        border: 0;
        border-radius: 16px;
        padding: 13px 16px;
        background: #00d4ff;
        color: #080d1c;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <img class="mark" src="/brand/vexora-logo.png" alt="Vexora" />
      <h1>You're offline</h1>
      <p>Vexora is installed and ready. Reconnect to load live tournaments, wallet activity, and squad updates.</p>
      <button type="button" onclick="window.location.reload()">Try Again</button>
    </main>
  </body>
</html>
